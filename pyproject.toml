[project]
name = "heu-experiments"
version = "0.1.0"
description = "First Hodgkin-Huxley Envelope Unit experiments and paper archive"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
experiments = [
    "cma>=3.3",
    "matplotlib>=3.8",
]
notebooks = [
    "cma>=3.3",
    "ipykernel>=6.0",
    "ipython>=8.0",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hh_envelope", "hh_transcriber"]

[tool.pytest.ini_options]
testpaths = ["hh_envelope/core/tests", "hh_transcriber/experiments/diagnostics"]
python_files = ["test_*.py", "_test_*.py", "_self_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
